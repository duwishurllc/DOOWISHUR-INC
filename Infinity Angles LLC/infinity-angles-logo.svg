<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Background -->
  <rect width="1000" height="1000" fill="#000000" rx="200"/>
  
  <!-- Defs for gradients and filters -->
  <defs>
    <!-- Gold gradient for accent -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <!-- Red gradient for accent -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC0000;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Red vertical bar (left side) -->
  <rect x="150" y="250" width="80" height="500" rx="40" fill="url(#redGradient)" filter="url(#shadow)"/>
  
  <!-- White rounded rectangle container for infinity symbol -->
  <rect x="380" y="200" width="500" height="600" rx="60" fill="white" filter="url(#shadow)"/>
  
  <!-- Gold accent border on rectangle -->
  <rect x="380" y="200" width="500" height="600" rx="60" fill="none" stroke="url(#goldGradient)" stroke-width="25"/>
  
  <!-- Infinity symbol (∞) inside the white box -->
  <g transform="translate(630, 500)">
    <!-- Left loop of infinity -->
    <path d="M -150 0 Q -200 -80 -150 -120 Q -80 -150 -50 -120 Q 0 -80 0 0 Q 0 80 -50 120 Q -80 150 -150 120 Q -200 80 -150 0" 
          fill="none" stroke="#000000" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right loop of infinity -->
    <path d="M 0 0 Q 50 -80 150 -120 Q 220 -150 250 -120 Q 300 -80 300 0 Q 300 80 250 120 Q 220 150 150 120 Q 50 80 0 0" 
          fill="none" stroke="#000000" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Optional: Add decorative angular lines representing "angles" -->
  <!-- Upper right angle accent -->
  <line x1="750" y1="250" x2="850" y2="150" stroke="url(#goldGradient)" stroke-width="20" stroke-linecap="round" opacity="0.8"/>
  <line x1="850" y1="150" x2="900" y2="200" stroke="url(#goldGradient)" stroke-width="20" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Lower left angle accent -->
  <line x1="420" y1="720" x2="320" y2="820" stroke="url(#redGradient)" stroke-width="20" stroke-linecap="round" opacity="0.8"/>
  <line x1="320" y1="820" x2="270" y2="770" stroke="url(#redGradient)" stroke-width="20" stroke-linecap="round" opacity="0.8"/>
</svg>